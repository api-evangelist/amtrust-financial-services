    description: Response identifier.
  - name: Timestamp
    type: string (date-time)
    description: When the response was produced.
  - name: CorrelationID
    type: string
    description: Trace identifier to quote to AmTrust support. The estate's request-tracing primitive.
  - name: HttpStatus
    type: HttpStatusCode
    description: Echoed HTTP status.
  - name: Messages
    type: array of ApiMessage
    description: Informational messages.
  - name: Errors
    type: array of ApiMessage
    description: The errors themselves. Multiple errors per response are supported.
  - name: IsOk
