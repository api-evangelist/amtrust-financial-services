      properties:
        liabilityOccurrence:
          $ref: '#/components/schemas/LiabilityLimitDto'
        generalAggregate:
          $ref: '#/components/schemas/LiabilityLimitDto'
        productsAggregate:
          $ref: '#/components/schemas/LiabilityLimitDto'
        medicalExpense:
          $ref: '#/components/schemas/LiabilityLimitDto'
        damageToPremisesRentedToYou:
          $ref: '#/components/schemas/DamageToPremisesRentedToYou'
      additionalProperties: false
      description: "<ul><li>generalAggregate - The options available for this limit will always be the limit equal to the Occurrence Limit selection, or limit 2X the Occurrence Limit.  <br/>Example:  If Occurrence Limit selection is 500000, and the limit sent for General Aggregate is NOT 500000 or 1000000, the API will default to what is accepted and selection will not be saved.</li>\n<li>productsAggregate - The options available for this limit will always be equal to the selection for General Aggregate, equal to the selection for Occurrence Limit, OR Excluded.  \n<ul><li>Example:  If General Aggregate selection is 1000000 and the limit sent for Products Aggregate is NOT 500000 or 1000000, or Excluded, the API will default to lowest value accepted and selection will not be saved.  \n</li><li>NOTE:  If General Aggregate selection is 500000, the only options available for the Products Aggregate will be 500000 or Excluded</li></ul></li>\n<li>DamageToPremisesRentedToYou - Available options will not exceed the Occurrence Limit selection.\n<br/>Example:  If quote is in NY or NJ, and Occurrence Limit selection is 100000, the only option for this limit will be 100000.  If any other selection is sent, the API will default to 100000 and selection will not be saved</li></ul>\n"
