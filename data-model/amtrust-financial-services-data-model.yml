envelope:
  note: >-
    Every commercial-lines response is wrapped in a shared IApiResponse envelope carrying ID, Timestamp,
    CorrelationID, HttpStatus, Messages[], Errors[], Paging and IsOk. The domain object sits inside it.
    Clients must unwrap before reaching any entity above.
