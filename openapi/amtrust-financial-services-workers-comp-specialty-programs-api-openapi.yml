  /api/v1/specialty-program/quotes/{quoteId}/eligibility:
    get:
      tags:
      - Workers Comp-Specialty Programs
      summary: Retrieves the current eligibility and status of the quote specified by quoteId.
      description: 'Retrieves the current eligibility and status of the quote specified by quoteId.


        __Quote Statuses that will return are below:__


        __•__ __Not Submitted__ – means quote has not been submitted to the underwriter; default status on quote creation and journey


        __•__ __Submitted__ – means the quote is submitted to an underwriter, and awaiting review


        __•__ __Approved__ – means the underwriter has approved this risk and quote can now be bound via the (POST) Bind Quote endpoint; the quote is now blocked for editing


        __•__ __UnderwriterDeclined__ – means the underwriter has declined this risk, and quote cannot be bound; the quote is now blocked for editing


        __•__ __AdditionalInformationNeeded__ – means the underwriter needs additional information before approving/declining risk. Underwriter will send an email to the agent listed as the contact on the quote


        __•__ __ApprovalSubjectTo__ – means the underwriter has approved the quote submit to outlined changes being made prior to binding; those changes will be outlined in an email to the agent contact on the quote


        Eligibility is broken down into the parameters below:


        __•__ __Class Code: Bind Eligible, Refer, Declined__


        __•__ __Questions: Bind Eligible, Refer, Declined__ (will default to Refer on initial quote creation, as questions have not been answered yet)


        __•__ __Territory: Bind Eligible, Refer, Declined__


        __•__ __Modifiers: Bind Eligible, Refer, Declined__


        __Please note:__ There may be other factors, not included in the breakdown, that impact the overall eligibility on a quote'
      operationId: get-api-v1-specialty-program-quotes-quoteid-eligibility
      parameters:
      - name: quoteId
        in: path
        required: true
        schema:
          minimum: 1.0
          type: integer
