openapi: 3.2.0
info:
  title: Amtrust Financial Services Agent Contacts API
  version: '1.0'
  description: 'Operations tagged Agent Contacts across 4 of this provider''s published API definitions: amtrust-financial-services-digital-bop-api-openapi.json, amtrust-financial-services-digital-cyber-api-openapi.json, amtrust-financial-services-digital-es-api-openapi.json, amtrust-financial-services-digital-pac-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://gateway.amtrustgroup.com/digital-bop
- url: https://prod-apim-gw.amtrustservices.com/digital-bop
- url: https://gateway.amtrustgroup.com/digital-cyber
- url: https://prod-apim-gw.amtrustservices.com/digital-cyber
- url: https://gateway.amtrustgroup.com/digital-es
- url: https://prod-apim-gw.amtrustservices.com/digital-es
- url: https://gateway.amtrustgroup.com/digital-pac
- url: https://prod-apim-gw.amtrustservices.com/digital-pac
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Agent Contacts
paths:
  /api/v1/agent-contacts:
    get:
      tags:
      - Agent Contacts
      summary: Retrieve all agent contacts
      description: Returns all agent contact IDs, names, and emails linked to the agency authenticated
      operationId: get-api-v1-agent-contacts
      responses:
        '401':
          description: Bad or expired token. To resolve this error, generate a new or refreshed token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorIApiResponse'
              example:
                responseId: c06a30939799
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 401
                isOk: false
                errors:
                - httpStatusCode: 401
                  messageCode: ERR-NOTAUTHORIZED
                  title: Bearer token is not authorized
                  isOk: false
                maxErrorIndex: 0
                _v: AD
        '403':
          description: The authenticated user or client does not have required permissions to complete this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorIApiResponse'
              example:
                responseId: 9fe42ed125cd
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 403
                isOk: false
                errors:
                - httpStatusCode: 403
                  messageCode: ERR-FORBIDDEN
                  title: The token provided does not have permissions for the requested action
                  isOk: false
                maxErrorIndex: 0
                _v: AD
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentContactDtoIEnumerableIApiResponse'
              example:
                data:
                - id: 1
                  name: George Washington
                  email: gwashington@uspresident.gov
                - id: 2
                  name: John Adams
                  email: jadams@uspresident.gov
                - id: 1
                  name: Thomas Jefferson
                  email: tjefferson@uspresident.gov
                responseId: 71f8e87007bd
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 200
                isOk: true
                _v: AD
    servers:
    - url: https://gateway.amtrustgroup.com/digital-bop
    - url: https://prod-apim-gw.amtrustservices.com/digital-bop
