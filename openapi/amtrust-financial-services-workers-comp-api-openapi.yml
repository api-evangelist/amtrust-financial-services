  /api/v1/classcodes/{classCodeId}/information:
    get:
      tags:
      - Workers Comp
      summary: Retrieves class code information based on the NAICS or SIC code sent.
      description: 'Retrieves class code information based on the NAICS or SIC code sent


        The state parameter is optional; if no state is specified, then the return will display class code information for each applicable state. If the state is included, then the response will include only the class code information for that specific state.


        Character limits:


        • NAICS code can be up to 6 numeric characters


        • SIC code can be up to 4 numeric characters'
      operationId: get-api-v1-classcodes-classcodeid-information
      parameters:
      - name: classCodeId
        in: path
        required: true
