domain_standards:
- id: ncci-class-codes
  standard: NCCI workers' compensation classification codes
  conforms: true
  evidence: >-
    openapi/amtrust-financial-services-digital-wc-api-openapi.json, components.schemas.ClassCode:
    "NCCI Class Code. Must be 4 numeric characters for all states except 'DE' and 'PA'". The contract
    also exposes /api/v1/state-classes-eligibility/{state} and per-quote class-code collections keyed on
    the same identifier scheme. An agency system that already speaks NCCI class codes — which every
    workers' compensation rating platform does — integrates without a translation layer.
  note: >-
    This is the domain identifier scheme that actually carries AmTrust's workers' compensation surface,
    and it is declared IN THE CONTRACT rather than claimed on a marketing page.
