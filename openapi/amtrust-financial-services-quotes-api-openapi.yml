    AdditionalInsuredDtoV2:
      required:
      - form
      type: object
      properties:
        form:
          enum:
          - 0 = Mortgagee
          - 1 = MgrLsrPrem
          - 2 = MortAssgnRec
          - 3 = LandLeased
          - 4 = InsuredPrem
          - 6 = Designated
          - 7 = SchedPerson
          - 8 = LossPayable
          - 9 = EquipmentLeased
          - 10 = CompOperation
          - 11 = Permits
          - 12 = OtherInsurance
          - 13 = EXTOFNI
          type: integer
          description: 'Short name for Additional Insured Forms

            <table><thead><tr><th>Form Name</th><th>Description</th></tr></thead><tbody><tr><td>Mortagee</td><td>BOP MORTGAGEE</td></tr><tr><td>MgrLsrPrem</td><td>ADDITIONAL INSURED - MANAGERS OR LESSORS OF PREMISES</td></tr><tr><td>MortAssgnRec</td><td>ADDITIONAL INSURED - MORTGAGEE, ASSIGNEE OR RECEIVER</td></tr><tr><td>LandLeased</td><td>ADDITIONAL INSURED - OWNERS OR OTHER INTERESTS FROM WHOM LAND HAS BEEN LEASED</td></tr><tr><td>InsuredPrem</td><td>ADDITIONAL INSURED - CO-OWNER OF INSURED PREMISES</td></tr><tr><td>Designated</td><td>ADDITIONAL INSURED - DESIGNATED PERSON OR ORGANIZATION</td></tr><tr><td>SchedPerson</td><td>ADDITIONAL INSURED - OWNERS, LESSEES OR CONTRACTORS - SCHEDULED PERSON OR ORGANIZATION</td></tr><tr><td>LossPayable</td><td>LOSS PAYABLE PROVISIONS</td></tr><tr><td>EquipmentLeased</td><td>ADDITIONAL INSURED - LESSOR OF LEASED EQUIPMENTS</td></tr><tr><td>CompOperation</td><td>ADDITIONAL INSURED OWNERS LESSEES OR CONTRACTORS - COMPLETED OPERATIONS</td></tr><tr><td>Permits</td><td>ADDITIONAL INSURED STATE OR POLITICAL SUBDIVISIONS - PERMITS RELATING TO PREMISES</td></tr><tr><td>OtherInsurance</td><td>ADDITIONAL INSURED - OWNERS, LESSEES, OR CONTRACTORS WITH ADDITIONAL INSURED REQUIREMENT IN CONSTRUCTION CONTRACT PRIMARY AND NON-CONTRIBUTORY-OTHER INSURANCE CONDITION</td></tr></tbody></table>'
          format: int32
        additionalInsuredName:
          type:
          - string
          - 'null'
          description: The name of the additional insured.
        propertyDescription:
          type:
          - string
          - 'null'
          description: PropertyDescription - Only required for Mortgagee, Vendor, and LossPayable forms
        clause:
          enum:
          - 0 = NotApplicable
          - 1 = A
          - 2 = B
          - 3 = C
          type: integer
          description: 'Only Applicable for Loss Payable Forms; value will be ignored if submitted for other form types.

            <table><thead><tr><th>Clause</th><th>Description</th></tr></thead><tbody><tr><td>NotApplicable</td><td>(Default) Clause Description is Not Applicable for Quote</td></tr><tr><td>A</td><td>Loss Payable Clause</td></tr><tr><td>B</td><td>Lenders'' Loss Payable Clause</td></tr><tr><td>C</td><td>Contract of Sale Clause</td></tr></tbody></table>'
          format: int32
        locationId:
          type:
          - integer
          - 'null'
          format: int32
        buildings:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          description: Building IDs - Only required for Mortgagee, LossPayable, MgrLsrPrem
        nameOfInsuredPersonOrganization:
          type:
          - string
          - 'null'
          description: NameOfInsuredPersonOrganization - Only required for EquipmentLeased and CompOperation forms
        leasedEquipmentDescription:
          type:
          - string
          - 'null'
          description: LeasedEquipmentDescription - Only required for EquipmentLeased form
        typeOfRisk:
          enum:
          - 1 = ApartmentAndOffice
          - 2 = AllOther
          type:
          - integer
          - 'null'
          description: TypeOfRisk - Only required for EquipmentLeased form
          format: int32
        leasedEquipmentLocation:
          type:
          - string
          - 'null'
          description: LeasedEquipmentLocation - Only required for EquipmentLeased form
        locationAndDescriptionOfCompletedOperations:
          type:
          - string
          - 'null'
          description: LocationAndDescriptionOfCompletedOperations - Only required for CompOperation form
        stateOrPoliticalSubdivision:
          type:
          - string
          - 'null'
          description: StateOrPoliticalSubdivision - Only required for Permits form
        namedInsured:
          type: boolean
          description: 'Indicates whether this is a Named Insured. When true, DBA and CommonOwnership fields are required.

            The remaining fields will be ignored, and Form field will default to EXTOFNI.'
        dba:
          type:
          - string
          - 'null'
          description: The DBA (Doing Business As) name. Required when NamedInsured is true.
        commonOwnership:
          type: boolean
          description: "Common Ownership should be selected for entities which share 51% or greater ownership interest. \nTo add an additional named insured common ownership must be TRUE.\nRequired when NamedInsured is true, and must be true to save a Named Insured."
      additionalProperties: false
