      summary: Retrieve Underwriting Questions
      description: 'This endpoint will return all underwriting questions, along with Question Title, Class Code and NAICS Code.


        If no effective date is entered it will default to today''s date.


        Note: The response is returned in a gzip format'
      operationId: get-api-v2-reference-resources-underwriting-questions
      parameters:
      - name: effectiveDate
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '401':
          description: Unauthorized
          content:
            application/gzip:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorIApiResponse_2'
              example:
                responseId: 804b211172b3
                timeStamp: '2026-08-07T11:04:11.0000000+00:00'
                httpStatusCode: 401
                isOk: false
                errors:
