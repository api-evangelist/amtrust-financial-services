info:
  title: Amtrust Financial Services Payment Plans API
  version: '1.0'
  description: 'Operations tagged Payment Plans across 2 of this provider''s published API definitions: amtrust-financial-services-digital-bop-api-openapi.json, amtrust-financial-services-digital-cyber-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://gateway.amtrustgroup.com/digital-bop
- url: https://prod-apim-gw.amtrustservices.com/digital-bop
- url: https://gateway.amtrustgroup.com/digital-cyber
- url: https://prod-apim-gw.amtrustservices.com/digital-cyber
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Payment Plans
paths:
  /api/v1/quotes/{quoteId}/payment-plans:
    get:
      tags:
      - Payment Plans
      summary: GET Payment Plans
      description: Retrieve all payment plans available to quote
      operationId: get-api-v1-quotes-quoteid-payment-plans
      parameters:
      - name: quoteId
        in: path
        required: true
        schema:
          minimum: 1.0
          type: integer
          format: int32
      responses:
        '401':
          description: Bad or expired token. To resolve this error, generate a new or refreshed token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorIApiResponse'
              example:
                responseId: 8a19329b4d6a
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 401
                isOk: false
                errors:
                - httpStatusCode: 401
                  messageCode: ERR-NOTAUTHORIZED
                  title: Bearer token is not authorized
                  isOk: false
                maxErrorIndex: 0
                _v: AD
        '403':
          description: The authenticated user or client does not have required permissions to complete this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorIApiResponse'
              example:
                responseId: 125f704d4987
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 403
                isOk: false
                errors:
                - httpStatusCode: 403
                  messageCode: ERR-FORBIDDEN
                  title: The token provided does not have permissions for the requested action
                  isOk: false
                maxErrorIndex: 0
                _v: AD
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanResponseIApiResponse'
              example:
                data:
                  agency:
                  - paymentPlanId: 1
                    paymentPlanDescription: Standard Payment In Full
                    billType: null
                  - paymentPlanId: 38
                    paymentPlanDescription: Standard Payment 50% Down + 1 Installment
                    billType: null
                  direct:
                  - paymentPlanId: 13
                    paymentPlanDescription: Standard Payment In Full
                    billType: null
                  - paymentPlanId: 39
                    paymentPlanDescription: Standard Payment 50% Down + 1 Installment
                    billType: null
                responseId: 7fe207b5cd8e
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 201
                isOk: true
                messages:
                - httpStatusCode: 200
                  messageCode: Deeplink
                  title: https://devk8s.amtrustgroup.com/usertest/webapp-nexus/AccountManagement/24786342
                  isOk: true
                maxMessageIndex: 0
                _v: AD
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorIApiResponse'
              example:
                responseId: 1e734db74b37
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 404
                isOk: false
                errors:
                - httpStatusCode: 404
                  messageCode: ERR-ItemNotFound
                  title: Item was not found
                  isOk: false
                maxErrorIndex: 0
                _v: AD
    post:
      tags:
      - Payment Plans
      summary: Saves selected payment plan to the specific quote
      operationId: post-api-v1-quotes-quoteid-payment-plans
      parameters:
      - name: quoteId
        in: path
        required: true
        schema:
          minimum: 1.0
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreatePaymentPlanRequest'
            example:
              paymentPlanId: 0
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentPlanRequest'
            example:
              paymentPlanId: 0
          text/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentPlanRequest'
            example:
