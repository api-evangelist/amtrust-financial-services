  auth_path_uat: /AuthServer_usertest/OpenIdConnect/Token on uatauth.amtrustgroup.com
  note: >-
    There is no test-vs-live key PREFIX. A UAT subscriber_id and a production subscriber_id are
    indistinguishable by inspection, so a client cannot tell from a credential which environment it is
    pointed at — the only signal is the hostname it was configured with.
