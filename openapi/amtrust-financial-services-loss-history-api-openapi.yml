info:
  title: Digital BOP Loss History API
  description: Digital BOP API allows users to create and edit Businessowners Policy (BOP) quotes
  version: '1.0'
servers:
- url: https://gateway.amtrustgroup.com/digital-bop
- url: https://prod-apim-gw.amtrustservices.com/digital-bop
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Loss History
paths:
  /api/v1/quotes/{quoteId}/loss-history:
    post:
      tags:
      - Loss History
      summary: Add loss history
      operationId: post-api-v1-quotes-quoteid-loss-history
      parameters:
      - name: quoteId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/LossHistoryPostRequestDto'
            example:
              hasPriorCarrier: true
              hasZeroClaimsInLastThreeYears: false
              lossApplication: 2
          application/json:
            schema:
              $ref: '#/components/schemas/LossHistoryPostRequestDto'
            example:
              hasPriorCarrier: true
              hasZeroClaimsInLastThreeYears: false
              lossApplication: 2
          text/json:
            schema:
              $ref: '#/components/schemas/LossHistoryPostRequestDto'
            example:
              hasPriorCarrier: true
              hasZeroClaimsInLastThreeYears: false
              lossApplication: 2
          application/*+json:
            schema:
              $ref: '#/components/schemas/LossHistoryPostRequestDto'
            example:
              hasPriorCarrier: true
              hasZeroClaimsInLastThreeYears: false
              lossApplication: 2
      responses:
        '401':
          description: Bad or expired token. To resolve this error, generate a new or refreshed token.
