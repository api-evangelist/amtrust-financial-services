      - name: quoteId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: loadQuestions
        in: query
        description: Set to "true" to return all questions associated with the created quote
        schema:
          type: boolean
          default: false
      - name: loadRateSummary
        in: query
        schema:
          type: boolean
          default: false
      responses:
