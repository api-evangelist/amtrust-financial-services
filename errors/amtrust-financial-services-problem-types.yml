- name: Gateway envelope
  used_by: Azure API Management itself, before a request reaches a backend
  observed: true
  source: live probe 2026-09-02
  examples:
  - status: 401
    body: '{ "statusCode": 401, "message": "Access denied due to missing subscription key. Make sure
      to include subscription key when making requests to an API." }'
  - status: 404
    body: '{ "httpStatusCode": 404, "messageCode": "ERR-NotFound", "title": "Item was not found",
      "detail": "Unable to match incoming request to an operation." }'
  note: >-
    The 404 envelope is the lowerCamel twin of the backend IApiResponse ApiMessage shape and carries a
    real MessageCode value, `ERR-NotFound` — the only MessageCode value observable anywhere. The 401
    envelope is a THIRD, different shape (statusCode/message). A client must therefore handle three
    error shapes depending on how far into the stack the request got.
problem_types:
- status: 400
  title: Validation error
  count: 115
  schema: BadRequestErrorIApiResponse (108) / BadRequestErrorBaseResponse
  description: >-
    Request failed validation. Field-level detail arrives in Errors[]. Dominant description across the
    estate is "Validation error" (93 operations); 21 say only "Bad Request".
  remediation: Read Errors[].Detail and Errors[].MessageCode; correct the named fields and retry.
- status: 401
  title: Bad or expired token
  count: 278
  schema: UnauthorizedErrorIApiResponse
  description: >-
    Documented on 254 operations as "Bad or expired token. To resolve this error, generate a new or
    refreshed token." Also returned by the gateway itself when the subscriber_id subscription key is
    missing, with a different body shape.
  remediation: >-
    Request a fresh token from https://auth.amtrustgroup.com/AuthServer/OpenIDConnect/Token (tokens
    live 4 hours) AND confirm the subscriber_id header is present.
- status: 403
  title: Insufficient permissions
  count: 258
  schema: ForbiddenErrorIApiResponse
  description: >-
    "The authenticated user or client does not have required permissions to complete this request."
    Authorization is by APIM product entitlement, not by token scope.
  remediation: Confirm the subscriber_id is entitled to the product containing this API.
- status: 404
  title: Not found
  count: 186
  schema: NotFoundErrorIApiResponse (169) / NotFoundErrorBaseResponse (13)
  description: Addressed resource does not exist, or the path did not match an operation at the gateway.
  remediation: Verify the identifier and the gateway path prefix for the API.
- status: 424
  title: Failed dependency
  count: 9
  schema: FailedDependencyErrorBaseResponse
  description: >-
    "An internal dependency has failed." AmTrust is one of very few providers in the catalog that
    documents 424 at all — it makes an upstream policy-administration failure distinguishable from a
    caller error, which is exactly what an automated retry needs.
  remediation: Retryable. Back off and retry; escalate with the CorrelationID if it persists.
- status: 500
  title: Internal server error
  count: 2
  description: Documented on only 2 of 387 operations.
  remediation: Retry with backoff; escalate with the CorrelationID.
coverage:
