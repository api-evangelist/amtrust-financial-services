source: >-
  Live unauthenticated request to https://gateway.amtrustgroup.com/digital-bop/api/v1/agent-contacts,
  the nine harvested OpenAPI documents, and AmTrust's own Azure API Management product catalog at
  apimanagement.amtrustgroup.com — probed 2026-09-02
tags:
  - Commercial Insurance
