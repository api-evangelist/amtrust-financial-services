  /api/v3/policies/{policy}/endorsements:
    post:
      tags:
      - Workers Comp
      summary: Saves the selected policy endorsement.
      description: 'The full list of potential endorsements based on the policy are


        • ''insured-name-update''


        • ''insured-mailing-address-update''


        • ''insured-fein-change''


        • ''partners-update''


        • ''insured-primary-address-update''


        • ''additional-insureds-update''


        • ''exposure-update''


        • ''officers-update''


        • ''legal-entity-update''


        • ''agent-other-request''


        • ''blanket-waiver-change''


        • ''specific-waivers-change''


        Primary Address Change endorsement fields


        Required fields


        Line1


        City


        State


        ZipCode


        UpdateMailingAddress


        Optional Fields


        Line2


        UpdateBillingAddress - This is needed if UpdateMailingAddress is TRUE


        EmployeeCount - This is only required in the states of FL, KY, ME, TN, UT, and MT.


        Additional Insureds Update endorsement fields


        Required fields


        AddressLine1


        City


        State


        ZipCode


        Optional Fields


        Id


        AddressLine2


        EmployeeCount - This is only required in the states of FL, KY, ME, TN, UT, and MT.


        Exposure Update endorsement fields


        Required fields


        State


        ClassCode


        DescriptionCode


        FullTimeEmployees


        PartTimeEmployees


        Payroll


        Optional Fields


        Notes, DisplayName, WindowsFileType and FileData - Those are required only if the payroll changes by more than 40%, including a 40% decrease.


        officers Update endorsement fields


        Required fields


        OfficerName


        Type


        State


        FormType


        EndorsementId


        OwnershipPercentage


        Optional Fields


        Id - Is required only for update


        Legal Entity Update endorsement fields


        Required fields


        LegalEntityCode


        Optional Fields


        Notes


        DisplayName, WindowsFileType, FileData - All three fields should be entered together


        Inspection contact information fields


        Required fields


        FirstName


        LastName


        Phone


        Optional Fields


        Email


        Agent Other endorsement fields


        Required fields


        Notes


        Optional Fields


        DisplayName, WindowsFileType, FileData - All three fields should be entered together


        EmployeeCount - This is only required in the states of FL, KY, ME, TN, UT, and MT.


        Blanket Waiver Change endorsement fields


        Required fields


        RemoveWaiver - True = remove waiver, False = add waiver


        Specific Waivers Change endorsement fields


        Required fields


        Id


        StartDate


        EndDate


        State


        FirstName


        LastName


        Line1


        Line2


        City


        State


        Zip


        JobDescription


        Payroll


        ClassCode


        Delete - True = remove waiver, False = add waiver'
      operationId: post-api-v3-policies-policy-endorsements
      parameters:
      - name: policy
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PostPolicyEndorsementModelV3'
            examples:
              Insured Name Update:
                value:
                  AgentContactId: 123
                  EffectiveDate: '2026-08-13T11:08:12.0000000+00:00'
                  PolicyEndorsements:
                  - Endorsements:
                    - Name: Name
                      DBA: dba
                    Type: insured-name-update
                    Reason: Change in Entity
