gaps:
- No MessageCode registry is published anywhere; the field is present on every error and enumerable nowhere.
- No 429 is documented on any operation, so a client cannot tell throttling from any other failure.
- Three different error body shapes are reachable depending on where the request fails.
- Media type is application/json, not application/problem+json, so generic RFC 9457 clients see nothing.
