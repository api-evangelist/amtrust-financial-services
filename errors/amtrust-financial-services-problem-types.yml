format: custom
media_type: application/json
rfc9457: false
note: >-
  AmTrust does not use RFC 9457 `application/problem+json`. It ships something structurally close to it
  and better than most: one envelope, reused across every API in the estate, carrying a machine-readable
  `MessageCode` plus human `Title` and `Detail` — the same three fields RFC 9457 calls `type`, `title`
  and `detail` — alongside a `CorrelationID` for support. Switching the media type to
  application/problem+json and renaming three fields would make this conformant with almost no work.
  What is missing is a PUBLISHED REGISTRY of MessageCode values: the field exists on every error in
  387 operations and not one code is enumerated anywhere in the contract or on the portal, so a client
  can read the shape but cannot branch on the code.
envelopes:
- name: IApiResponse error envelope
  used_by: >-
    UnauthorizedErrorIApiResponse, ForbiddenErrorIApiResponse, NotFoundErrorIApiResponse,
    BadRequestErrorIApiResponse — 813 of the 848 documented error responses
  fields:
  - name: ID
