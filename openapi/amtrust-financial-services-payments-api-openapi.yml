                type: string
                payrollMonth: string
                amount:
                  currency: string
                  total: 0
                taxAmount:
                  currency: string
                  total: 0
                feeAmount:
                  currency: string
                  total: 0
                paymentDescription: string
          application/*+json:
            schema:
              $ref: '#/components/schemas/PaymentPostModel'
            example:
              quoteId: 0
              sendEmail: true
              payerInfo:
                firstName: string
                lastName: string
                address:
