description: >-
  AmTrust publishes NO priced plans for its API program. There is no pricing page, no self-serve tier and
  no published rate card. Access is a negotiated partner arrangement: https://amtrustfinancial.com/api
  (HTTP 200) is a lead-capture form that asks for a name, company, email, phone and a completed
  "ANA Digital Partner Vetting Questionnaire" PDF, and states no commercial terms of any kind. plan_count
  is 0 because that is the true published number, not because the page was unreadable.
note: >-
  This artifact REPLACES a 2026-05-04 bulk-sweep scaffold that invented Free / Professional / Enterprise
  tiers with fabricated quotas (1,000 and 100,000 requests per month) attached to the host
  api.amtrustservices.com, which does not resolve. None of that was ever published by AmTrust.
access_products:
  note: >-
    AmTrust's production Azure API Management instance publishes three subscription PRODUCTS. These are
    access-control groupings, not commercial plans — none carries a price, a currency or a billing period.
    Two of them ("Starter", "Unlimited") carry Azure API Management's verbatim out-of-the-box sample
    descriptions, so their stated call ceilings should not be read as AmTrust's negotiated partner terms.
    All nine externally exposed APIs sit in the custom "External" product, which states no limit at all.
  source: https://apimanagement.amtrustgroup.com/.../amtrust-prod-apim/products?api-version=2022-08-01
  products:
  - id: external
    name: External
    state: published
    subscription_required: true
    approval_required: false
    description: a product for displaying externally exposed APIs in the developer portal
    apis:
    - conversa-engine-api
    - digital-bop
    - digital-cyber
    - digital-es
    - digital-pac
    - DigitalAPI
    - experience-claims-medical-case
    - experience-next-gen-bond-pro-api
    - RCEAPI
    stated_limits: none
  - id: starter
    name: Starter
    state: published
    subscription_required: true
    approval_required: false
    subscriptions_limit: 1
    description: Subscribers will be able to run 5 calls/minute up to a maximum of 100 calls/week.
    stated_limits: 5 calls/minute; 100 calls/week
    caveat: Verbatim Azure API Management default product text; no AmTrust API is assigned to it.
  - id: unlimited
    name: Unlimited
    state: published
    subscription_required: true
    approval_required: true
    subscriptions_limit: 1
    description: Subscribers have completely unlimited access to the API. Administrator approval is required.
    stated_limits: none
    caveat: Verbatim Azure API Management default product text; no AmTrust API is assigned to it.
