        lessorLiability:
          type:
          - boolean
          - 'null'
        propertyDeductible:
          type:
          - string
          - 'null'
          description: "\nIf unsent, the value will be defaulted to 500.\n\nAccepted values (All states except WA):\n<ul>\n  <li>250</li>\n  <li>500</li>\n  <li>1,000</li>\n  <li>2,500</li>\n</ul>\n\nAccepted values (WA state):\n<ul>\n  <li>500</li>\n  <li>1,000</li>\n  <li>2,500</li>\n  <li>5,000</li>\n  <li>7,500</li>\n  <li>10,000</li>\n</ul>"
        roofType:
          type:
          - string
          - 'null'
          description: AsphaltShingles<br/>BuiltUpRoofing<br/>ClayTiles<br/>MetalRoofPanels<br/>ConcretePaver<br/>RubberMembrane<br/>StoneBallast
        highestStoryOccupied:
          type: integer
          format: int32
        digitalClientWorkflow:
          type:
          - string
          - 'null'
        classCode:
          $ref: '#/components/schemas/ClassCodePostDtoV1'
        annualSales:
          type:
          - integer
          - 'null'
          description: 'This field is required if the class code included is one of the following: 74111, 74231, 74511, 74541, 74601, 74661, 74751, 74781, 74841, 74901, 75641, 75791, 75821, and 75881'
          format: int32
        annualPayroll:
          type:
          - integer
          - 'null'
          description: 'This field is required if the class code included is one of the following: 74111, 74231, 74511, 74541, 74601, 74661, 74751, 74781, 74841, 74901, 75641, 75791, 75821, and 75881'
          format: int32
        numberOfEmployees:
          type: integer
          description: 'This field is required if the class code included is one of the following: 74111, 74231, 74511, 74541, 74601, 74661, 74751, 74781, 74841, 74901, 75641, 75791, 75821, and 75881'
          format: int32
        constructionCategoryCode:
          maximum: 6.0
          minimum: 1.0
          type: integer
          description: 1 --> Frame<br/>2 --> Joisted Masonry<br/>3 --> Noncombustible<br/>4 --> Masonry Noncombustible<br/>5 --> Modified Fire Resistive<br/>6 --> Fire Resistive
          format: int32
        totalSquareFootage:
          type: integer
          format: int32
