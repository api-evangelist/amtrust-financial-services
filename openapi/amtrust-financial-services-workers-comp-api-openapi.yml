openapi: 3.2.0
info:
  title: Digital WC Workers Comp API
  description: Digital WC API allows users to create, edit, and bind Worker’s Compensation (WC) quotes
  version: '1.0'
servers:
- url: https://gateway.amtrustgroup.com/DigitalAPI
- url: https://prod-apim-gw.amtrustservices.com/DigitalAPI
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Workers Comp
paths:
  /api/v1/affirmation:
    get:
      tags:
      - Workers Comp
      summary: Retrieves the affirmation statement that will need to be displayed to agents…
      description: 'Retrieves the affirmation statement that will need to be displayed to agents prior to binding the quote to a policy


        This can be called in conjunction with the V2 Bind endpoint; the actual submission of affirmation will occur in the V2 Quote Bind endpoint.


        __Please note:__ If you are already presenting a statement of affirmation to your agents/users, you do not need to use this endpoint. This is only for partners who do not currently have their own statement in place'
      operationId: get-api-v1-affirmation
      responses:
        '401':
          description: Bad or expired token. To resolve this error, generate a new or refreshed token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorIApiResponse'
              example:
                responseId: 6e419f211597
                timeStamp: '2026-08-13T11:08:11.0000000+00:00'
                httpStatusCode: 401
                isOk: false
                errors:
                - MessageCode: ERR-NOTAUTHORIZED
                  Title: Bearer token is not authorized
                  httpStatusCode: 401
                  isOk: false
                maxErrorIndex: 0
                _v: AD
        '403':
          description: The authenticated user or client does not have required permissions to complete this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorIApiResponse'
              example:
                responseId: 190e392ff359
                timeStamp: '2026-08-13T11:08:11.0000000+00:00'
                httpStatusCode: 403
                isOk: false
                errors:
                - MessageCode: ERR-FORBIDDEN
                  Title: The token provided does not have permissions for the requested action
                  httpStatusCode: 403
                  isOk: false
                maxErrorIndex: 0
                _v: AD
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringBaseResponse'
              example:
                StatusCode: 100 = Continue
                Message: string
                AdditionalMessages:
                - string
                Errors: {}
                Data: string
