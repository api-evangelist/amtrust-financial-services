components:
  schemas:
    AdditionalInsured:
      type: object
      properties:
        Id:
          type: integer
          format: int32
        NamedInsuredId:
          type: integer
          format: int32
        Name:
          type:
          - string
          - 'null'
        Dba:
          type:
          - string
          - 'null'
        Fein:
          type:
          - string
          - 'null'
        LegalEntity:
          type: integer
          format: int32
        UnemploymentNumber:
          type:
          - string
          - 'null'
        Line1:
          type:
          - string
          - 'null'
        Line2:
          type:
          - string
          - 'null'
        City:
          type:
          - string
          - 'null'
        State:
          type:
          - string
          - 'null'
        Zip:
          type:
          - string
          - 'null'
        EmployeeCount:
          type: integer
          format: int32
      additionalProperties: false
    ContactApiModel:
      type: object
      properties:
        FirstName:
          type:
          - string
          - 'null'
          description: FirstName
        LastName:
          type:
          - string
          - 'null'
          description: LastName
        Email:
          type:
          - string
          - 'null'
          description: Email
          format: email
        Phone:
          pattern: ((\(\d{3}\)?)|(\d{3}))([\s-./]?)(\d{3})([\s-./]?)(\d{4})
          type:
          - string
          - 'null'
          description: Phone
        AgentContactId:
          type:
          - integer
          - 'null'
          description: AgentContactId
          format: int32
        AgentContactName:
          type:
          - string
          - 'null'
          description: AgentContactName
