openapi: 3.2.0
info:
  title: Digital BOP Payments API
  description: Digital BOP API allows users to create and edit Businessowners Policy (BOP) quotes
  version: '1.0'
servers:
- url: https://gateway.amtrustgroup.com/digital-bop
- url: https://prod-apim-gw.amtrustservices.com/digital-bop
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Payments
paths:
  /api/v1/policies/{policyId}/balance-summary:
    get:
      tags:
      - Payments
      summary: Balance-Summary
      description: 'Retrieve the current balance on a policy

        Please be aware that if "CanMakePayment" is false, the current balance will reflect $0.00 Policy.'
      operationId: get-api-v1-policies-policyid-balance-summary
      parameters:
      - name: policyId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '401':
          description: Bad or expired token. To resolve this error, generate a new or refreshed token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorIApiResponse'
              example:
                responseId: 173fc390cc2f
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 401
                isOk: false
                errors:
                - httpStatusCode: 401
                  messageCode: ERR-NOTAUTHORIZED
                  title: Bearer token is not authorized
                  isOk: false
                maxErrorIndex: 0
                _v: AD
        '403':
          description: The authenticated user or client does not have required permissions to complete this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorIApiResponse'
              example:
                responseId: 3dbf7b8e774e
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 403
                isOk: false
                errors:
                - httpStatusCode: 403
                  messageCode: ERR-FORBIDDEN
                  title: The token provided does not have permissions for the requested action
                  isOk: false
                maxErrorIndex: 0
                _v: AD
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSummaryResponseIApiResponse'
              example:
                data:
                  quoteId: 12345
                  policyId: 6789
                  currentDueAmount: 0.3
                  remainingDueAmount: 5.7
                  canMakePayment: true
                responseId: 0f3488bf1c64
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 200
                isOk: true
                _v: AD
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorIApiResponse'
              example:
                responseId: 21076e4744e6
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 400
                isOk: false
                errors:
                - httpStatusCode: 400
                  messageCode: ERR-ValidationErr
                  title: Validation Error
                  detail: Validation detail message
                  isOk: false
                maxErrorIndex: 0
                _v: AD
  /api/v1/policies/{policyId}/payment:
    post:
      tags:
      - Payments
      summary: Make a payment
      description: 'This endpoint is used to make a payment on the policy.


        The Balance Summary endpoint can be used to retrieve the current balance on the policy.


        Payment sent must be equal to the current amount due.


        __Please note:__ Payment may take up to 24 hours to reflect on the account'
      operationId: post-api-v1-policies-policyid-payment
      parameters:
      - name: policyId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PaymentPostModel'
            example:
              quoteId: 0
              sendEmail: true
              payerInfo:
                firstName: string
                lastName: string
                address:
                  line1: string
                  line2: string
                  city: string
                  state: string
                  zip: string
                  country: 225 = US
                  countryName: string
                emailAddress: string
                phone: string
              eCheck:
                accountNumber: string
                routingNumber: string
                financialInstitution: string
                accountType: 1 = Checking
              creditCard:
                creditCardNumber: string
                cardType: 0 = Visa
                cvv: string
                expirationMonth: 0
                expirationYear: 0
              paymentSystemInfo:
                id: 0
                name: string
                lob: string
                type: string
                payrollMonth: string
                amount:
                  currency: string
                  total: 0
                taxAmount:
                  currency: string
                  total: 0
                feeAmount:
                  currency: string
                  total: 0
                paymentDescription: string
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPostModel'
            example:
              quoteId: 0
              sendEmail: true
              payerInfo:
                firstName: string
                lastName: string
                address:
                  line1: string
                  line2: string
                  city: string
                  state: string
                  zip: string
                  country: 225 = US
                  countryName: string
                emailAddress: string
