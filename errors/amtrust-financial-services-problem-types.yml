    description: Present on the shared envelope even for errors.
  api_message_fields:
  - name: MessageCode
    type: string
    description: >-
      The machine-readable error code. NO published registry of values exists — this is the single
      largest gap in AmTrust's error semantics.
  - name: MessageType
    type: ApiMessageType
  - name: Title
    type: string
    description: Short human-readable summary (RFC 9457 `title` equivalent).
  - name: Detail
    type: string
    description: Human-readable explanation (RFC 9457 `detail` equivalent).
  - name: Reference
    type: string
  - name: Internal
    type: string
    description: Internal diagnostic string; should not be surfaced to end users.
- name: BaseResponse error envelope
  used_by: NotFoundErrorBaseResponse, FailedDependencyErrorBaseResponse — 22 responses
  fields:
  - name: StatusCode
    type: HttpStatusCode
  - name: Message
    type: string
  - name: AdditionalMessages
    type: array of string
  - name: Errors
    type: object (field name -> array of message strings)
