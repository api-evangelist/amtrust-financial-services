source: >-
  openapi/ (nine harvested AmTrust OpenAPI documents), AmTrust's Azure API Management catalogs
  (apimanagement.amtrustgroup.com prod, utapimanagement.amtrustgroup.com UAT), and probes of
  status.amtrustfinancial.com, status.amtrustgroup.com and amtrustfinancial.statuspage.io — 2026-09-02
provider: AmTrust Financial Services
providerId: amtrust-financial-services
versioning:
  scheme: path-segment major version
  style: per-operation, not per-API
  observed:
  - /api/v1/... (the majority)
  - /api/v2/... (quotes create, bind, some policy operations)
  - /api/v3/... (specialty-program endorsements, one BOP quote read)
  - /api/v{version}/... (templated — Reinsurance Contract Entry and Experience Claims Medical Case)
  note: >-
    Versions move at the OPERATION level inside a single document, so one API serves v1, v2 and v3
    paths side by side. The Digital WC API alone spans all three. Two APIs publish a TEMPLATED
    `{version}` path segment with no enum and no default anywhere in the contract, so a client cannot
    determine from the spec what value to send. That is a real integration blocker, not a nit.
  info_version_declared: '1.0'
  info_version_note: >-
    All nine documents declare info.version "1.0" regardless of the v1/v2/v3 paths they contain, so
    the document version conveys nothing.
  apim_revision: >-
    Azure API Management revisioning is available and effectively unused — the revisions collection is
    empty for every production API and apiRevision is "1" throughout.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  deprecated_operations: 0
  note: >-
    No deprecation policy is published, no operation in any of the 387 carries `deprecated: true`, and
    neither the Sunset (RFC 8594) nor the Deprecation header is mentioned anywhere. The only "sunset"
    string in the whole contract set is `sunsetClause`, a reinsurance treaty business field in the
    RCE API — unrelated. Because versions are mixed at operation level with no deprecation marking,
    there is no signal telling an integrator that /api/v1/quotes is superseded by /api/v2/quotes.
  no_pointer_reason: >-
    No Deprecation pointer is emitted in apis.yml because no deprecation policy exists to point at.
