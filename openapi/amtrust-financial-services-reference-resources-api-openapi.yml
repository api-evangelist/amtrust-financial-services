openapi: 3.2.0
info:
  title: Amtrust Financial Services Reference Resources API
  version: '1.0'
  description: 'Operations tagged Reference Resources across 4 of this provider''s published API definitions: amtrust-financial-services-digital-bop-api-openapi.json, amtrust-financial-services-digital-cyber-api-openapi.json, amtrust-financial-services-digital-es-api-openapi.json, amtrust-financial-services-digital-pac-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://gateway.amtrustgroup.com/digital-bop
- url: https://prod-apim-gw.amtrustservices.com/digital-bop
- url: https://gateway.amtrustgroup.com/digital-cyber
- url: https://prod-apim-gw.amtrustservices.com/digital-cyber
- url: https://gateway.amtrustgroup.com/digital-es
- url: https://prod-apim-gw.amtrustservices.com/digital-es
- url: https://gateway.amtrustgroup.com/digital-pac
- url: https://prod-apim-gw.amtrustservices.com/digital-pac
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Reference Resources
paths:
  /api/v1/reference-resources/class-codes:
    get:
      tags:
      - Reference Resources
      summary: Retrieve class code information
      description: 'This endpoint allows user to retrieve class code information based on query information below:


        - If no state/class code passed, endpoint will return all class codes, with information necessary to understand any state limitations that exist


        - If state is passed, endpoint will return only the class codes that are available in that specific state


        - If state and class code is passed, endpoint will return only that class code'
      operationId: get-api-v1-reference-resources-class-codes
      parameters:
      - name: state
        in: query
        schema:
          type: string
      - name: classCode
        in: query
        schema:
          type: string
      responses:
        '401':
          description: Bad or expired token. To resolve this error, generate a new or refreshed token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorIApiResponse'
              example:
                responseId: 03f174f03bf4
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 401
                isOk: false
                errors:
                - httpStatusCode: 401
                  messageCode: ERR-NOTAUTHORIZED
                  title: Bearer token is not authorized
                  isOk: false
                maxErrorIndex: 0
                _v: AD
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassCodeDtoIEnumerableIApiResponse'
              example:
                data:
                - stateLimitation: All states not WA
                  classCodeId: 5
                  classCode: '65121'
                  classDescriptionCode: null
                  description: Accounting Services - Office - CPAs
                  naics: '541211'
                  sic: '8721'
                  requiresPersonalPropertyCoverage: false
                  requiresBuildingCoverage: false
                - stateLimitation: WA only
                  classCodeId: 27
                  classCode: '50141'
                  classDescriptionCode: null
                  description: Bakeries - Distributors - No baking on premises
                  naics: '422490'
                  sic: '5149'
                  requiresPersonalPropertyCoverage: false
                  requiresBuildingCoverage: false
                - stateLimitation: WA only
                  classCodeId: 192
                  classCode: '33018'
                  classDescriptionCode: null
                  description: Fruits and Vegetables - no seasonal operations
                  naics: '445110'
                  sic: '5411'
                  requiresPersonalPropertyCoverage: true
                  requiresBuildingCoverage: false
                responseId: b7d9e462da15
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 200
                isOk: true
                messages:
                - httpStatusCode: 200
                  messageCode: SUCCESS
                  isOk: true
                maxMessageIndex: 0
                _v: AD
    servers:
    - url: https://gateway.amtrustgroup.com/digital-bop
    - url: https://prod-apim-gw.amtrustservices.com/digital-bop
  /api/v1/reference-resources/terrorism-statement:
    get:
      tags:
      - Reference Resources
      summary: Retrieve Terrorism Coverage Acknowledgement Statement
      description: This endpoint is meant to be used in conjunction with the (POST) Terrorism Acknowledgement endpoint. Insureds will need to acknowledge that they have read the statement before binding
      operationId: get-api-v1-reference-resources-terrorism-statement
      responses:
        '401':
          description: Bad or expired token. To resolve this error, generate a new or refreshed token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorIApiResponse'
              example:
                responseId: aa5f3cf51637
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 401
                isOk: false
                errors:
                - httpStatusCode: 401
                  messageCode: ERR-NOTAUTHORIZED
                  title: Bearer token is not authorized
                  isOk: false
                maxErrorIndex: 0
                _v: AD
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringIApiResponse'
              example:
                data: String
                responseId: f9da7a753496
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 200
                isOk: true
                _v: AD
    servers:
    - url: https://gateway.amtrustgroup.com/digital-bop
    - url: https://prod-apim-gw.amtrustservices.com/digital-bop
  /api/v1/reference-resources/questions:
    get:
      tags:
      - Reference Resources
      summary: Retrieve class code underwriting questions
      description: 'This endpoint allows user to request underwriting questions applicable under a class code/state combination


        Please note: The response will also include all general questions that have to be answered regardless of class code'
      operationId: get-api-v1-reference-resources-questions-classcodeid-classcodeid-state-state
      parameters:
      - name: classCodeId
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Bad or expired token. To resolve this error, generate a new or refreshed token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorIApiResponse'
              example:
                responseId: dbb71c63d00c
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 401
                isOk: false
                errors:
                - httpStatusCode: 401
                  messageCode: ERR-NOTAUTHORIZED
                  title: Bearer token is not authorized
                  isOk: false
                maxErrorIndex: 0
                _v: AD
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetQuestionsDtoIApiResponse'
              example:
                data:
                  generalQuestions:
                  - answer: null
                    requirementConditions: null
                    questionId: '1156'
                    questionType: Text(Numeric)
                    text: How many years in business?
                    potentialResponses: []
                    childQuestions:
                    - answer: null
                      requirementConditions:
                        conditions:
                        - qualifyingParentAnswer: '5'
                          qualifyingOperator: '>'
                      questionId: '1157'
                      questionType: Radio
                      text: Does the applicant have less than 3 years of recent experience as the owner or general manager in this or a similar operation of the same size and type?
                      potentialResponses:
                      - 'Yes'
                      - 'No'
                      childQuestions: null
                  classCodeQuestions:
                  - answer: null
                    requirementConditions: null
                    questionId: '1352'
                    questionType: Radio
                    text: Are all tenants required by their lease to carry insurance and list the owner (our insured) as an Additional Insured?
                    potentialResponses:
                    - 'Yes'
                    - 'No'
                    childQuestions: null
                responseId: 1b406deaca32
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 200
                isOk: true
                messages:
                - httpStatusCode: 200
                  messageCode: SUCCESS
                  isOk: true
                maxMessageIndex: 0
                _v: AD
    servers:
    - url: https://gateway.amtrustgroup.com/digital-bop
    - url: https://prod-apim-gw.amtrustservices.com/digital-bop
  /api/v1/reference-resources/all-questions:
    get:
      tags:
      - Reference Resources
      summary: Retrieve all underwriting questions
      description: This endpoint will return all underwriting questions required for every class code. The general questions, that are required for every quote regardless of class code, will also be returned.
      operationId: get-api-v1-reference-resources-all-questions
      parameters:
      - name: state
        in: query
        schema:
          type: string
      - name: effectiveDate
        in: query
        schema:
          pattern: ^\d{2}-\d{2}-\d{4}$
          type: string
      responses:
        '401':
          description: Bad or expired token. To resolve this error, generate a new or refreshed token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorIApiResponse'
              example:
                responseId: cfe348e8e5a5
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
