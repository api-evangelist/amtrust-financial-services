  IdentityServer (production and UAT). They do NOT sit at the host root — AmTrust mounts the authorization
  server under /AuthServer (prod) and /AuthServer_usertest (UAT), so the discovery document is at
  <host>/AuthServer/.well-known/openid-configuration. Every other named path 404s on every host. The
  amtrustfinancial.com marketing site and both Azure API Management developer portals answer /.well-known/*
  with their standard HTML 404 page, and the API gateway answers with its JSON not-found envelope; neither
  is a document. A WellKnown pointer is emitted on the strength of the two OIDC documents only. No
  security.txt is served anywhere, so no SecurityTxt pointer is emitted.
