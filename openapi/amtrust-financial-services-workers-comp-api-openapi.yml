  /api/v2/quotes/{quoteId}/classCodes:
    put:
      tags:
      - Workers Comp
      summary: Replaces the entire collection of current class codes on a quote with the class…
      description: 'Replaces the entire collection of current class codes on a quote with the class code collection supplied in the request body.


        To add one or more class codes: include all current class codes including the class code(s) you wish to add.


        To remove one or more class codes: include all class codes you wish to keep except for the class code(s) you wish to remove.


        To replace one or more class codes: include, unchanged, all class codes you wish to keep as-is and replace class codes you wish to replace with replacement class codes.


        If all current class codes on the quote are desired to remain, and additional class codes are needed, the existing class codes __must__ be included in the request body, along with the new class codes


        __If existing class codes are excluded from request, they will be removed from the quote__


        Multiple of the same class code and description code are not allowed in a single state quote


        ratingZip is only required if the class code is in the state of CA and the ratingZip has not already been set.'
      operationId: put-api-v2-quotes-quoteid-classcodes
