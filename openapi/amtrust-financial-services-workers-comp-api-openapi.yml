        __•__ The state and effective date are optional:


        __•__ If no state is passed, the response will return in a byte representation of a JSON response, and will include all states. If state is passed, a JSON response will return, and will include only information within that state


        __•__ If no effective date is passed, the effective date will be defaulted to today'
