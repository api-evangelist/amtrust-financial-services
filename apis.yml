name: AmTrust Financial Services
description: >-
  AmTrust Financial Services is a multinational specialty property and casualty insurer focused on small
  to mid-sized businesses, with more than 7,000 employees, 500,000+ small commercial policies in force
  and an AM Best rating of A- (Excellent). AmTrust runs a real, production API program on Azure API
  Management — nine externally exposed APIs at gateway.amtrustgroup.com spanning 387 operations, covering
  workers' compensation, Businessowners Policy, cyber, Excess & Surplus and commercial package
  quote-rate-bind, plus medical case management claims, surety bond documents and reinsurance contract
  entry. Authentication is two-factor at the edge — an Azure API Management subscription key
  (subscriber_id) alongside a four-hour OpenID Connect bearer token from AmTrust's own IdentityServer at
  auth.amtrustgroup.com. Access is partner-gated; there is no self-serve signup and no published pricing,
  and credentials follow a Digital Partner Vetting Questionnaire.
