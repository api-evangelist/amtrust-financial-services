          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanPostResponseIApiResponse'
              example:
                responseId: 4dfe151fb54a
                timeStamp: '2026-07-23T11:04:42.0000000+00:00'
                httpStatusCode: 201
                isOk: true
                messages:
                - httpStatusCode: 200
                  messageCode: Deeplink
                  title: https://devk8s.amtrustgroup.com/usertest/webapp-nexus/AccountManagement/24786342
                  isOk: true
