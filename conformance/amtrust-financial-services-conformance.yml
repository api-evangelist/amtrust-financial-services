conformance:
- id: openapi
  conforms: true
  version: 3.0.1
  evidence: >-
    Nine OpenAPI 3.0.1 documents totalling 387 operations, exported verbatim from AmTrust's own Azure
    API Management instance and saved to openapi/_original/. Every operation carries an operationId and
    a summary; 2xx and 4xx responses are modelled with named component schemas.
- id: oidc
  conforms: true
  evidence: >-
    A conformant OpenID Connect discovery document is served at
    https://auth.amtrustgroup.com/AuthServer/.well-known/openid-configuration with issuer,
    authorization_endpoint, token_endpoint, jwks_uri, userinfo_endpoint, end_session_endpoint,
    introspection_endpoint, revocation_endpoint, RS256 id_token signing and scopes_supported. A second
    conformant document is served for UAT.
- id: oauth2
  conforms: true
  evidence: >-
    client_credentials, authorization_code, refresh_token, token_exchange and password grants are
    advertised in discovery; the portal documents client_credentials and password flows with
    Content-Type application/x-www-form-urlencoded and client_secret_post credentials.
  caveats:
  - >-
    The `password` (resource owner password credentials) grant is enabled in production. RFC 9700
    (OAuth 2.0 Security BCP) says it MUST NOT be used and OAuth 2.1 removes it.
  - >-
    code_challenge_methods_supported advertises `plain` alongside `S256`, permitting a PKCE downgrade.
  - >-
    No oauth2 or openIdConnect securityScheme appears in ANY of the nine OpenAPI documents, so the
    OAuth half of the contract is undiscoverable from the machine-readable spec.
- id: rfc9457
  conforms: false
  evidence: >-
    Errors are returned as application/json, not application/problem+json. The envelope is close in
    spirit — MessageCode / Title / Detail map onto type / title / detail — but no operation declares
    the problem+json media type. See errors/amtrust-financial-services-problem-types.yml.
- id: idempotency
  conforms: false
  evidence: >-
    No Idempotency-Key header, no idempotency parameter and no idempotency prose appears in any of the
    nine documents or on either developer portal. 100+ unguarded POST operations, including
    quote-to-policy bind, have no replay protection.
- id: pagination
  conforms: partial
  evidence: >-
    Six of nine documents carry pagination. The Digital lines use an `ApiPaging` object
    (Request/Response) inside the shared IApiResponse envelope with pageSize; the Reinsurance Contract
    Entry API takes pageNumber/pageSize in the request body. There is no Link header, no cursor and no
    single cross-estate convention.
- id: rate-limit-headers
  conforms: false
  evidence: >-
    No RateLimit-*, X-RateLimit-* or Retry-After header on the live gateway response, and no 429
